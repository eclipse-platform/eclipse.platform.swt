      parameterCount: 1
      anchor: "if (string == null)"
      position: AFTER
      statements: "\tif (viewport != null && viewport.active ()) {\n\t\tviewport.add (string, viewport.getItemCount ());\n\t\treturn;\n\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
