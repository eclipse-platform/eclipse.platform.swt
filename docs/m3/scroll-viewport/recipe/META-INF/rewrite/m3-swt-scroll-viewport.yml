type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.SwtScrollViewportWin32
displayName: win32 controls keep logical bounds beyond the native coordinate range (planes)
description: >-
  Catalogue VIEWPORT_GEOMETRY. A control whose bounds leave the 16-bit range of native child windows keeps
  logical bounds in ViewportPlane; a control larger than the band becomes a plane whose native window covers
  the band around its visible part. Each hook is one delegation; the logic lives in ViewportPlane and
  ViewportPlaneGeometry. -Dswt.widget.mode.Composite=original selects stock geometry.
recipeList:
  - com.synexia.openrewrite.viewport.SwtScrollViewportWin32Control
  - com.synexia.openrewrite.viewport.SwtScrollViewportWin32Composite
  - com.synexia.openrewrite.viewport.SwtScrollViewportWin32Canvas
  - com.synexia.openrewrite.viewport.SwtScrollViewportWin32Combo
  - com.synexia.openrewrite.viewport.SwtScrollViewportWin32Caret
  - com.synexia.openrewrite.viewport.SwtScrollViewportWin32Scrollable
  - com.synexia.openrewrite.viewport.SwtScrollViewportWin32Display
  - com.synexia.openrewrite.viewport.SwtScrollViewportWin32Widget
---
