      declaringClasses: [org.eclipse.swt.widgets.Table]
      memberName: viewport
      beforeMethod: Table
      memberSource: "\t/* Viewport mediation of a plain Table (see TableViewport); null for SWT.VIRTUAL and in the original mode. */\n\tTableViewport viewport;"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
