      methodName: createWidget
      parameterCount: 0
      position: METHOD_END
      statements: "\tif (TableViewport.ENABLED && (style & SWT.VIRTUAL) == 0) viewport = new TableViewport (this);"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.swt.widgets.Table]
      methodName: wmNotifyChild
      parameterCount: 3
      anchor: "if ((style & SWT.VIRTUAL) != 0) { return new LRESULT(-1);"
      position: BEFORE
      statements: "\t\t\tif (viewport != null) return viewport.findItem (lParam);"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.swt.widgets.Table]
      methodName: wmNotifyChild
      parameterCount: 3
      anchor: "if ((style & SWT.VIRTUAL) != 0) { if (!ignoreSelect)"
      position: BEFORE
      statements: "\t\t\tif (viewport != null) viewport.stateChanged (lParam);"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.swt.widgets.Table]
      methodName: setItemCount
      parameterCount: 1
      anchor: "count = Math.max (0, count);"
      position: AFTER
      statements: "\tif (viewport != null) {\n\t\tviewport.setItemCount (count);\n\t\treturn;\n\t}"
