---
type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.SwtRenderModesM3Names
displayName: M3 names of the drawn planes
description: >-
  Brief rule 14: nothing of ours is called Skija or Skia. The m3 backend's package and types get M3 names, the
  WidgetMode constant SKIJA becomes M3, and the backend loader follows. Third-party binding classes keep their
  package (their prebuilt natives bind to it); licence notices keep naming their source.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.eclipse.swt.internal.render.skija.SkijaRowCanvas
      newFullyQualifiedTypeName: org.eclipse.swt.internal.render.m3.M3RowCanvas
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.eclipse.swt.internal.render.skija.SkijaGpu
      newFullyQualifiedTypeName: org.eclipse.swt.internal.render.m3.M3Gpu
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.eclipse.swt.internal.render.skija
      newPackageName: org.eclipse.swt.internal.render.m3
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.eclipse.swt.internal.render.RowBackends skija(..)
      newMethodName: m3
  - org.openrewrite.text.FindAndReplace:
      find: '\bWidgetMode\.SKIJA\b'
      replace: WidgetMode.M3
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: '\bSKIJA_CANVAS\b'
      replace: M3_CANVAS
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: '"org\.eclipse\.swt\.internal\.render\.skija\.SkijaRowCanvas"'
      replace: '"org.eclipse.swt.internal.render.m3.M3RowCanvas"'
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: '\bSkijaGpu\b'
      replace: M3Gpu
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: '\bSkijaRowCanvas\b'
      replace: M3RowCanvas
      regex: true
