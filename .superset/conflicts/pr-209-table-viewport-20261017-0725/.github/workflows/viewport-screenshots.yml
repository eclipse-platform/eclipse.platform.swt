name: Viewport Screenshot and Resource Regression

concurrency:
  group: viewport-screenshots-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - 'bundles/org.eclipse.swt/**'
      - 'tests/org.eclipse.swt.tests/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/viewport-screenshots.yml'

permissions:
  contents: read

jobs:
  gtk3-x11:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      java: '${{ matrix.java }}'
      native: gtk.linux.x86_64
      gtk: gtk3
      gdk_backend: x11
      performance: false
      runtodotests: false
      api_check: false
      viewport_screenshots: true
      viewport_resources: true
