# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: "SWT Build"

on:
  workflow_call:
    inputs:
      runner:
        description: "build.runs-on value"
        type: string
        required: true
      java:
        description: "Java version"
        type: string
        required: true
      native:
        description: "Native target identifier (one of gtk.linux.x86_64, win32.win32.x86_64, cocoa.macosx.x86_64, cocoa.macosx.aarch64)"
        type: string
        required: true
      performance:
        description: "Run performance tests too (one of true, false)"
        type: boolean
        required: false
        default: false
      runtodotests:
        description: "Run TODO tagged tests too (one of true, false)"
        type: boolean
        required: false
        default: false
      api_check:
        description: |
          Run the API tools check and generate the javadoc (one of true, false)

          Both only depend on the Java sources, so enable this for a single job
          per operating system.
        type: boolean
        required: false
        default: false
      gtk:
        description: |
          (Required on Linux only) GTK version to use (one of gtk3, gtk4)

          Controls the SWT_GTK4 environemnt variable.
        type: string
        required: false
        default: ""
      gdk_backend:
        description: |
          (Required on Linux only) GDK_BACKEND to use (one of x11, wayland)

          The backend will affect which compositor to use.
        type: string
        required: false
        default: ""
      viewport_screenshots:
        description: "Run the property-gated viewport screenshot regression after the build."
        type: boolean
        required: false
        default: false
      viewport_resources:
        description: "Run isolated GTK3 viewport RSS, heap and CPU regression gates."
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
    - name: checkout swt
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
      with:
       fetch-depth: 0 # required for jgit timestamp provider to work
       lfs: false # lfs-pull is not necessary, the natives are re-build in each run
    - name: Install Linux requirements
      if: ${{ inputs.native == 'gtk.linux.x86_64'}}
      shell: bash
      run: |
        set -x
        sudo apt-get update -qq
        # Required tools (GHA normally provides these in their base images)
        sudo apt-get install -qq -y build-essential git
        # GTK3 dependencies
        sudo apt-get install -qq -y libgtk-3-dev freeglut3-dev webkit2gtk-driver
        # GTK4 dependencies
        sudo apt-get install -qq -y libgtk-4-dev freeglut3-dev libwebkitgtk-6.0-4
        # x11 + wayland runtimes
        sudo apt-get install -qq -y dbus-daemon xvfb mutter

    - name: Disable AppArmor when testing WebKit on GTK4
      if: ${{ inputs.native == 'gtk.linux.x86_64' && inputs.gtk == 'gtk4' }}
      shell: bash
      run: |
        # WebKit for GTK4 uses bwrap and on Ubuntu 24.04 default settings are not working
        # so turn off apparmor. We are already running in a protected environment, so we
        # don't really need this extra level.
        sudo sysctl kernel.unprivileged_userns_clone=1
        sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

    - name: Pull large static Windows binaries
      if: ${{ inputs.native == 'win32.win32.x86_64'}}
      run: |
        git lfs pull --include='/binaries/org.eclipse.swt.win32.win32.x86_64/WebView2Loader.dll'
    - name: Set up Java ${{ inputs.java }}
      uses: actions/setup-java@de5a937a1dc73fbc1a67d7d1aa4bebc1082f3190 # v5.0.0
      with:
        java-version: ${{ inputs.java }}
        distribution: 'temurin'
        cache: maven
    - name: Set up Maven
      uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
      with:
        maven-version: 3.9.16
    - name: Build
      env:
        GTK_XCFLAGS: '-Wno-deprecated-declarations'
        SWT_GTK4: "${{ inputs.gtk == 'gtk4' && '1' || '0' }}"
        GDK_BACKEND: "${{ inputs.gdk_backend }}"

      # Run wayland/x11 sessions in a similar way that GTK tests itself
      # https://gitlab.gnome.org/GNOME/gtk/-/blob/gtk-4-20/.gitlab-ci/run-tests.sh
      run: >-
        ${{ inputs.gdk_backend == 'x11' && 'dbus-run-session -- xvfb-run -a -s "-screen 0 1024x768x24 -noreset"' || '' }}
        ${{ inputs.gdk_backend == 'wayland' && 'XDG_RUNTIME_DIR="$(mktemp -p $(pwd) -d xdg-runtime-XXXXXX)" dbus-run-session -- mutter --headless --wayland --no-x11 --virtual-monitor 1024x768 --  ' || '' }}
        mvn --batch-mode -V -U -e
        --threads 1C
        -DforkCount=1
        '-Dnative=${{ inputs.native }}'
        ${{ inputs.api_check && '-Papi-check -Pjavadoc' || '' }}
        '-Dtycho.baseline.replace=none'
        --fail-at-end
        -DskipNativeTests=false
        -DfailIfNoTests=false
        ${{ (inputs.runtodotests == false && inputs.gtk =='gtk4' && inputs.gdk_backend == 'wayland') && '-DexcludedGroups=gtk4-todo,gtk4-wayland-todo' || '' }}
        ${{ (inputs.runtodotests == false && inputs.gtk =='gtk4' && inputs.gdk_backend == 'x11')     && '-DexcludedGroups=gtk4-todo' || '' }}
        ${{ (inputs.runtodotests == false && inputs.gtk =='gtk3' && inputs.gdk_backend == 'wayland') && '-DexcludedGroups=gtk3-wayland-todo' || '' }}
        clean install
    - name: Viewport screenshot regression
      if: ${{ inputs.viewport_screenshots && inputs.native == 'gtk.linux.x86_64' }}
      env:
        SWT_GTK4: "0"
        GDK_BACKEND: x11
      working-directory: tests/org.eclipse.swt.tests
      run: >-
        dbus-run-session -- xvfb-run -a -s "-screen 0 1200x800x24 -noreset"
        mvn --batch-mode -V -U -e
        -DforkCount=1
        '-Dnative=${{ inputs.native }}'
        -DskipNativeTests=true
        -DfailIfNoTests=true
        -Dtest=ViewportScreenshotRegressionTest,Test_org_eclipse_swt_awt_Java2DCanvas
        -Dswt.java2d.evidenceDirectory=target/screenshots/java2d
        -Dswt.viewport.screenshotRegression=true
        -Dswt.viewport.screenshots=target/screenshots/viewport
        integration-test


    - name: Validate SWT screen captures with OpenCV
      if: ${{ inputs.viewport_screenshots && inputs.native == 'gtk.linux.x86_64' }}
      working-directory: tests/org.eclipse.swt.tests
      shell: bash
      run: |
        python3 -m venv target/viewport-vision
        target/viewport-vision/bin/python -m pip install opencv-python-headless==4.12.0.88 numpy==2.2.6
        target/viewport-vision/bin/python - <<'PYTHON'
        # SPDX-License-Identifier: Apache-2.0
        """Automated SWT screenshot oracle. The recipe embeds this owner verbatim in CI."""
        import hashlib
        import json
        from pathlib import Path
        import xml.etree.ElementTree as ET

        import cv2
        import numpy as np


        def require(condition, message):
            if not condition:
                raise AssertionError(message)


        def expected_frame(scale, background):
            frame = np.full((80 * scale, 120 * scale, 3), background, dtype=np.uint8)
            frame[10 * scale:50 * scale, 40 * scale:80 * scale] = (0, 255, 0)
            frame[58 * scale:70 * scale, 90 * scale:110 * scale] = (0, 255, 255)
            return frame


        def check_canary(first, second):
            require(first is not None and second is not None, 'Cannot decode canary PNGs')
            require(first.shape == second.shape, 'Canary dimensions changed')
            height, width, channels = first.shape
            require(channels == 3 and width % 120 == 0 and height % 80 == 0,
                    'Canary cropped or invalid dimensions')
            scale = width // 120
            require(scale > 0 and height // 80 == scale, 'Nonuniform canary scale')
            for label, actual, background in (('first', first, (0, 0, 255)),
                                               ('second', second, (255, 0, 0))):
                expected = expected_frame(scale, background)
                delta = cv2.absdiff(actual, expected)
                require(int(delta.max()) == 0, label + ': stale, blank, shifted or misclipped frame')
                green = cv2.inRange(actual, (0, 255, 0), (0, 255, 0))
                count, _, stats, _ = cv2.connectedComponentsWithStats(green, connectivity=8)
                require(count == 2, label + ': overlap must be one connected component')
                require(stats[1].tolist() == [40 * scale, 10 * scale, 40 * scale,
                                              40 * scale, 1600 * scale * scale],
                        label + ': overlap bounds or area changed')
            changed = cv2.countNonZero(cv2.cvtColor(cv2.absdiff(first, second), cv2.COLOR_BGR2GRAY))
            require(changed == (120 * 80 - 40 * 40 - 20 * 12) * scale * scale,
                    'Repaint changed the wrong area')
            return {'scale': scale, 'repaintPixels': changed, 'exactGeometry': True}


        def negative_controls():
            first = expected_frame(1, (0, 0, 255))
            second = expected_frame(1, (255, 0, 0))
            check_canary(first, second)
            # Exercise the persisted-image oracle with defects independent of SWT assertions.
            missing_overlap = second.copy()
            missing_overlap[10:50, 40:80] = (255, 0, 0)
            leaking_clip = second.copy()
            leaking_clip[50:80, 80:120] = (0, 255, 255)
            defects = {'blank': np.zeros_like(second), 'stale': first,
                       'shifted': np.roll(second, 3, axis=1), 'cropped': second[:, :-1],
                       'missing-overlap': missing_overlap, 'clip-leak': leaking_clip}
            for label, broken in defects.items():
                try:
                    check_canary(first, broken)
                except AssertionError:
                    continue
                raise AssertionError('Validator admitted negative control: ' + label)
            return sorted(defects)


        def check_java2d(output):
            """Reuse the viewport lane's decoded-pixel and component operators for Java2D."""
            facts = json.loads((output / 'capture-metadata.json').read_text())
            require(facts['captureApi'] == 'GC(Display).copyArea', 'Java2D capture API')
            require(facts['backend'] == 'gtk', 'Java2D unqualified backend')
            require(facts['scrollbarMode'] == 'SWT.NONE', 'Java2D controlled scrollbar geometry')
            width, height = facts['pixelSize']
            require([width, height] == facts['screenBounds'][2:], 'Java2D pixel geometry is not 1:1')
            require(facts['dpi'][0] > 0 and facts['dpi'][1] > 0, 'Java2D DPI metadata')
            require(facts['origin'] == [29, 37], 'Java2D pan origin')
            require(facts['coverBounds'] == [31, 27, 73, 51], 'Java2D overlap bounds')
            require(facts['rendererCalls'] > 0, 'Java2D no renderer calls')
            names = ('before', 'panned', 'covered', 'uncovered', 'fresh')
            seals = {capture['name']: capture['sha256'] for capture in facts['captures']}
            require(set(seals) == set(names), 'Java2D capture set')
            images = {}
            for name in names:
                path = output / (name + '.png')
                require(hashlib.sha256(path.read_bytes()).hexdigest() == seals[name], name + ': Java2D hash')
                images[name] = cv2.imread(str(path), cv2.IMREAD_COLOR)

            def tiles(origin):
                rows, columns = np.indices((height, width), dtype=np.int64)
                columns = (columns + origin[0]) // 16
                rows = (rows + origin[1]) // 16
                red = 40 + (columns * 37 + rows * 17) % 176
                green = 35 + (columns * 13 + rows * 41) % 180
                blue = 45 + (columns * 29 + rows * 23) % 170
                return np.stack((blue, green, red), axis=2).astype(np.uint8)

            initial, panned = tiles((0, 0)), tiles((29, 37))
            covered = panned.copy()
            covered[27:78, 31:104] = (0, 255, 0)
            expected = {'before': initial, 'panned': panned, 'covered': covered,
                        'uncovered': panned, 'fresh': panned}

            def validate(frames):
                for name in names:
                    actual = frames[name]
                    require(actual is not None and actual.shape == (height, width, 3), name + ': Java2D cropped frame')
                    require(int(cv2.absdiff(actual, expected[name]).max()) == 0,
                            name + ': Java2D stale, blank, shifted, overlap or clip mismatch')
                    require(cv2.countNonZero(cv2.Canny(actual, 40, 120)) >= 20, name + ': Java2D blank frame')
                green = cv2.inRange(frames['covered'], (0, 255, 0), (0, 255, 0))
                count, _, stats, _ = cv2.connectedComponentsWithStats(green, connectivity=8)
                require(count == 2 and stats[1].tolist() == [31, 27, 73, 51, 3723],
                        'Java2D overlap component geometry')
                require(cv2.countNonZero(cv2.cvtColor(cv2.absdiff(frames['before'], frames['panned']), cv2.COLOR_BGR2GRAY)) > 20,
                        'Java2D pan did not repaint')
                return True

            validate(images)
            leaking = images['covered'].copy()
            leaking[78:84, 104:116] = (0, 255, 0)
            defects = {'blank': ('fresh', np.zeros_like(images['fresh'])),
                       'stale': ('fresh', images['before']),
                       'shifted': ('panned', np.roll(images['panned'], 3, axis=1)),
                       'cropped': ('panned', images['panned'][:, :-1]),
                       'missing-overlap': ('covered', images['panned']),
                       'clip-leak': ('covered', leaking)}
            controls = output / 'negative-controls'
            controls.mkdir(exist_ok=True)
            rejected = []
            for label, (name, broken) in defects.items():
                path = controls / (label + '.png')
                require(cv2.imwrite(str(path), broken), label + ': failed control write')
                candidate = dict(images)
                candidate[name] = cv2.imread(str(path), cv2.IMREAD_COLOR)
                try:
                    validate(candidate)
                except AssertionError:
                    rejected.append(label)
                else:
                    raise AssertionError('Java2D validator admitted negative control: ' + label)
            receipt = {'status': 'PASS', 'opencv': cv2.__version__, 'numpy': np.__version__,
                       'captureApi': facts['captureApi'], 'screenBounds': facts['screenBounds'],
                       'dpi': facts['dpi'], 'pixelSize': [width, height], 'captures': seals,
                       'exactTilePixels': width * height * 5, 'overlapPixels': 3723,
                       'negativeControlsRejected': sorted(rejected),
                       'scope': 'GTK3/X11 1:1 screen pixels, pan/cover/uncover/fresh parity'}
            (output / 'opencv-validation.json').write_text(json.dumps(receipt, indent=2) + '\n')
            return receipt


        def main():
            rejected = negative_controls()
            java2d = check_java2d(Path('target/screenshots/java2d'))
            java2d_suite = ET.parse('target/surefire-reports/TEST-org.eclipse.swt.tests.junit.Test_org_eclipse_swt_awt_Java2DCanvas.xml').getroot()
            java2d_counts = {key: int(java2d_suite.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
            require(java2d_counts == {'tests': 11, 'failures': 0, 'errors': 0, 'skipped': 0}, str(java2d_counts))
            report = Path('target/surefire-reports/TEST-org.eclipse.swt.tests.junit.ViewportScreenshotRegressionTest.xml')
            suite = ET.parse(report).getroot()
            counts = {key: int(suite.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
            require(counts == {'tests': 4, 'failures': 0, 'errors': 0, 'skipped': 0}, str(counts))
            lifetime = dict(line.split('=', 1) for line in Path('target/capture-qualification/graphics-lifetime.properties').read_text().splitlines())
            for key, expected in {'capturePaths': '3', 'successfulCaptures': '48', 'writeFailures': '3',
                                  'positiveLeakControls': '2', 'retainedGraphicsDelta': '0'}.items():
                require(lifetime[key] == expected, 'Graphics resource qualification: ' + key)
            output = Path('target/screenshots/viewport')
            scenes = ('table-checked-selection', 'tree-pinned-expanded', 'tree-pinned-collapsed',
                      'tree-pinned-restored', 'viewport-vertical-scroll', 'viewport-horizontal-scroll',
                      'viewport-narrow', 'viewport-wide', 'viewport-affine-clip-stroke')
            metrics, images = {}, {}
            for name in scenes:
                facts = dict(line.split('=', 1) for line in (output / (name + '.txt')).read_text().splitlines() if '=' in line)
                require(facts['capture.api'] == 'SWT.GC(Display).copyArea', name + ': capture API')
                require(facts['capture.coordinateSpace'] == 'display-logical', name + ': coordinates')
                require(facts['capture.backend'] == 'x11', name + ': unqualified backend')
                for suffix, key in (('-screen.png', 'capture.sha256'), ('.png', 'screenshot.sha256')):
                    path = output / (name + suffix)
                    data = path.read_bytes()
                    require(data.startswith(bytes.fromhex('89504e470d0a1a0a')), str(path))
                    require(hashlib.sha256(data).hexdigest() == facts[key], str(path) + ': hash mismatch')
                    pixels = cv2.imread(str(path), cv2.IMREAD_COLOR)
                    require(pixels is not None and pixels.size > 0, str(path) + ': decode failed')
                    edges = cv2.countNonZero(cv2.Canny(pixels, 40, 120))
                    require(edges >= 20, str(path) + ': blank or missing scene geometry')
                    metrics[name + suffix] = {'width': pixels.shape[1], 'height': pixels.shape[0], 'edgePixels': edges}
                    if suffix == '-screen.png':
                        require(facts['capture.pixels'] == str(pixels.shape[1]) + 'x' + str(pixels.shape[0]), name + ': dimensions')
                        images[name] = pixels
            before, after = (cv2.imread(str(output / ('capture-canary-' + suffix + '.png')))
                             for suffix in ('first', 'second'))
            canary = check_canary(before, after)
            vertical, horizontal = images['viewport-vertical-scroll'], images['viewport-horizontal-scroll']
            require(vertical.shape == horizontal.shape, 'Scroll frame dimensions changed')
            scroll_delta = cv2.countNonZero(cv2.cvtColor(cv2.absdiff(vertical, horizontal), cv2.COLOR_BGR2GRAY))
            require(scroll_delta > 20, 'Horizontal scrolling produced a stale frame')
            narrow, wide = images['viewport-narrow'], images['viewport-wide']
            require(narrow.shape[0] < wide.shape[0] and narrow.shape[1] < wide.shape[1], 'Resize capture is stale')
            receipt = {'status': 'PASS', 'opencv': cv2.__version__, 'numpy': np.__version__,
                       'junit': counts, 'sceneArtifacts': metrics, 'canary': canary,
                       'scrollChangedPixels': scroll_delta, 'negativeControlsRejected': rejected,
                       'graphicsLifetime': lifetime, 'java2d': java2d, 'java2dJUnit': java2d_counts, 'manualQaRequired': False, 'scope': 'GTK3/X11 controlled geometry and scene sanity; no cross-platform golden approval'}
            (output / 'opencv-validation.json').write_text(json.dumps(receipt, indent=2) + '\n')
            print(json.dumps(receipt, sort_keys=True))


        if __name__ == '__main__':
            main()
        PYTHON

    - name: Viewport memory and CPU regression
      if: ${{ inputs.viewport_resources && inputs.native == 'gtk.linux.x86_64' }}
      env:
        SWT_GTK4: "0"
        GDK_BACKEND: x11
      working-directory: tests/org.eclipse.swt.tests
      shell: bash
      run: |
        dbus-run-session -- xvfb-run -a -s "-screen 0 1200x800x24 -noreset" \
          mvn --batch-mode -V -e -DforkCount=1 \
          '-Dnative=${{ inputs.native }}' -DskipNativeTests=true \
          -DfailIfNoTests=true -Dtest=ViewportResourceRegressionTest \
          -Dswt.viewport.resourceRegression=true integration-test
        python3 - <<'PYTHON'
        import pathlib, xml.etree.ElementTree as ET
        report = pathlib.Path('target/surefire-reports/TEST-org.eclipse.swt.tests.junit.ViewportResourceRegressionTest.xml')
        suite = ET.parse(report).getroot()
        counts = {key: int(suite.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
        assert counts == {'tests': 13, 'failures': 0, 'errors': 0, 'skipped': 0}, counts
        evidence = pathlib.Path('target/viewport-resources')
        expected = [f'{scenario}-{trial}.properties' for scenario in ('cold', 'scroll', 'collapse', 'logical-cold', 'logical-far', 'logical-scroll', 'logical-collapse', 'java2d-cold', 'java2d-scroll', 'java2d-resize-zoom') for trial in range(3)]
        expected += ['native-control-0.properties', 'cpu-control-0.properties', 'native-prefix-control-0.properties']
        assert all((evidence / name).is_file() for name in expected), expected
        PYTHON

    - name: Performance tests
      if: ${{ inputs.performance }}
      env:
        SWT_GTK4: "${{ inputs.gtk == 'gtk4' && '1' || '0' }}"
        GDK_BACKEND: "${{ inputs.gdk_backend }}"
      working-directory: tests/org.eclipse.swt.tests
      run: >-
        ${{ inputs.gdk_backend == 'x11' && 'dbus-run-session -- xvfb-run -a -s "-screen 0 1024x768x24 -noreset"' || '' }}
        ${{ inputs.gdk_backend == 'wayland' && 'XDG_RUNTIME_DIR="$(mktemp -p $(pwd) -d xdg-runtime-XXXXXX)" dbus-run-session -- mutter --headless --wayland --no-x11 --virtual-monitor 1024x768 --  ' || '' }}
        mvn --batch-mode -V -U -e
        -DforkCount=1
        --fail-at-end
        -DskipNativeTests=true
        -DfailIfNoTests=true
        -Dtest=PerformanceTests
        integration-test
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ inputs.native }}-${{ inputs.gtk }}-${{ inputs.gdk_backend }}-java${{ inputs.java }}
        if-no-files-found: warn
        path: |
          ${{ github.workspace }}/**/target/surefire-reports/*.xml
          ${{ github.workspace }}/**/target/screenshots/**/*.png
          ${{ github.workspace }}/**/target/screenshots/**/*.txt
          ${{ github.workspace }}/**/target/screenshots/**/*.json
          ${{ github.workspace }}/**/target/viewport-resources/*.properties
          ${{ github.workspace }}/**/target/capture-qualification/*.properties
          ${{ github.workspace }}/**/*.log
          ${{ github.workspace }}/**/*.dump
          ${{ github.workspace }}/**/*.dumpstream
